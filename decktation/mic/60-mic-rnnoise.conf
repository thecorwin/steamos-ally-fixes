# RNNoise noise suppression for the ROG Ally internal mic (room + fan noise).
# Exposes "Noise Canceling Mic" (effect_output.rnnoise) as a source.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Noise Canceling Mic"
      media.name       = "Noise Canceling Mic"
      filter.graph = {
        nodes = [
          # Same plugin/label Valve uses for the Steam Deck mic. Its only control
          # is a VAD gate (default 0 = off): pure denoise, no chopped words.
          { type = ladspa  name = rnnoise  plugin = "/usr/lib/ladspa/rnnoise_ladspa.so"  label = nt-filter }
        ]
      }
      capture.props = {
        node.name = "effect_input.rnnoise"
        audio.position = [ MONO ]
        target.object = "alsa_input.pci-0000_09_00.6.analog-stereo"
        node.passive = true
        stream.dont-remix = false
      }
      playback.props = {
        node.name = "effect_output.rnnoise"
        node.description = "Noise Canceling Mic"
        media.class = Audio/Source
        audio.position = [ MONO ]
      }
    }
  }
]
